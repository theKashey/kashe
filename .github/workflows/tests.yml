name: tests
on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: write # the badge
      pull-requests: write # the comment
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # the review reads the change from where it starts
      - uses: actions/setup-node@v7
        with:
          node-version: 24 # the CLI needs 22.15 or newer
      - run: npm ci
      - uses: Variance-Authority/variance-authority/.github/actions/variance/review@7cc5fee52081a01971529320d5ca3b310caa2188 # TODO: Variance-Authority/action/review@v1 once released
        with:
          suite: unit
          test: npx jest
          badge: 'true'
